<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FEEDBACK</title>
        <link rel="stylesheet" href="feedback.css">
     </head>   
<body>
      <main>
        <div class="cat">
        <form>
            <h1>Feedback</h1>
    <label for="name"><strong><i>NAME:</i></strong></label>
    <input type="text" id="name" name="name" placeholder="name">
    <br>
    <br>
    <label for="email"><strong><i>Email</i></strong></label>
    <input type="email" id="email" name="email" placeholder="email">
    <br>
    <br>
    <label for="phone"><strong><i>PHONE :</i></strong></label>
    <input type="tel" id="phone" name="phone" placeholder="contact">
    <br>
    <br>
    <label for="gender"><strong><i>GENDER :</i></strong></label>
        <br>
          <input type="radio" id="male" name="gender" value="male">
          <label for="male">MALE</label><br>
          <input type="radio" id="female" name="gender" value="female">
          <label for="female">FEMALE</label><br>
          <input type="radio" id="others" name="gender" value="others">
          <label for="others">OTHERS</label>
    <br>
    <br>
    <label for="Course"><strong><i>SELECT COURSE :</i></strong></label><br>
    <br>
    <select id="course" name="course">
        <option value="html">HTML & Web Fundamentals</option>
        <option value="css">CSS & Responsive Design</option>
        <option value="javascript">JavaScript Programming</option>
        <option value="database">DataBase Management System</option>
        <option value="dsa">Data Structures & Algorithms</option>
        <option value="operating-system">Operating Systems</option>
        <option value="software-engineering">Software Engineering</option>
    </select>
    <br>
    <br>
    <label for="feedback"><strong><i>WRITE YOUR FEEDBACK :</i></strong></label><br>
    <br>
    <textarea id="feedback" name="feedback"></textarea>
<br>
<br>
<label for="rating"><strong><i>RATE THE WEBSITE:</i></strong></label>
<br>
<br>
<select id="rating" name="rating">
    <option>Excellent</option>
    <option>Good</option>
    <option>ok-ok</option>
    <option>Bad</option>
    <option>Very Bad</option>
</select>
<br>
<br>
  <a href="contact.html"><button>SUBMIT</button></a>
</form>
</div>
</main>
<footer>
    <p>&copy 2026 Student Portal. All rights reserved.</p>
</footer>
</body>
</html>
